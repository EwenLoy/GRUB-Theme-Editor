<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GRUB Theme Editor</title>
<style>
  :root{
    --bg-0:#1a1a1a;
    --bg-1:#222222;
    --bg-2:#2a2a2a;
    --bg-3:#333333;
    --border:#3a3a3a;
    --border-light:#454545;
    --text-0:#e8e8e8;
    --text-1:#a8a8a8;
    --text-2:#707070;
    --accent:#5b8a72;
    --accent-dim:#3d5f4d;
    --danger:#a85b5b;
    --mono: "SF Mono","Cascadia Code","Consolas",monospace;
    --sans: -apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg-0);
    color:var(--text-0);
    font-family:var(--sans);
    font-size:13px;
    overflow:hidden;
    user-select:none;
  }
  input, textarea{user-select:text;}
  #app{display:flex;flex-direction:column;height:100vh;}
  #main-row{display:flex;flex:1;min-height:0;}
  .splitter-v{width:5px;flex-shrink:0;background:var(--bg-0);cursor:col-resize;}
  .splitter-v:hover, .splitter-v.active{background:var(--accent-dim);}
  .splitter-h{height:5px;flex-shrink:0;background:var(--bg-0);cursor:row-resize;}
  .splitter-h:hover, .splitter-h.active{background:var(--accent-dim);}
  .panel-col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
  #inspector, #os-config{display:flex;flex-direction:column;}

  /* ---------- TOPBAR ---------- */
  #topbar{
    height:44px;flex-shrink:0;
    display:flex;align-items:center;gap:4px;
    padding:0 12px;
    background:var(--bg-1);
    border-bottom:1px solid var(--border);
  }
  #topbar .title{font-weight:600;color:var(--text-0);letter-spacing:0.2px;white-space:nowrap;margin-right:6px;}
  #topbar .title span{color:var(--text-2);font-weight:400;}
  #topbar .spacer{flex:1;}
  #topbar .divider{width:1px;height:22px;background:var(--border);margin:0 6px;}
  button{
    background:var(--bg-2);
    border:1px solid var(--border-light);
    color:var(--text-0);
    padding:6px 12px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    font-family:var(--sans);
    white-space:nowrap;
  }
  button:hover{background:var(--bg-3);}
  button.primary{background:var(--accent-dim);border-color:var(--accent);}
  button.primary:hover{background:var(--accent);}
  button:active{transform:translateY(1px);}
  input[type=file]{display:none;}

  /* ---------- MENU BAR (File / Вид) ---------- */
  .menu-item{position:relative;}
  .menu-btn{
    background:transparent;border:1px solid transparent;
    color:var(--text-1);
    padding:6px 10px;
    font-size:12px;border-radius:4px;
  }
  .menu-btn:hover, .menu-item.open .menu-btn{background:var(--bg-2);color:var(--text-0);}
  .menu-dropdown{
    position:absolute;top:calc(100% + 4px);left:0;
    background:var(--bg-2);
    border:1px solid var(--border-light);
    border-radius:5px;
    min-width:210px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    padding:4px;
    display:none;
    z-index:60;
  }
  .menu-item.open .menu-dropdown{display:block;}
  .menu-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:7px 8px;border-radius:4px;
    cursor:pointer;font-size:12px;color:var(--text-0);
  }
  .menu-row:hover{background:var(--bg-3);}
  .menu-row .kbd{color:var(--text-2);font-size:10.5px;font-family:var(--mono);}
  .menu-check{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--text-0);}
  .menu-check:hover{background:var(--bg-3);}
  .menu-check .box{
    width:14px;height:14px;border-radius:3px;
    border:1px solid var(--border-light);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;flex-shrink:0;background:var(--bg-0);
  }
  .menu-check.checked .box{background:var(--accent-dim);border-color:var(--accent);color:var(--text-0);}
  .menu-sep{height:1px;background:var(--border);margin:4px 2px;}

  /* ---------- CANVAS CONTEXT MENU ---------- */
  #ctx-menu{
    position:fixed;
    background:var(--bg-2);
    border:1px solid var(--border-light);
    border-radius:5px;
    min-width:190px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    padding:4px;
    display:none;
    z-index:70;
  }
  #ctx-menu.show{display:block;}
  #ctx-menu .menu-row{padding:7px 10px;}

  /* ---------- LAYERS ---------- */
  #layers{background:var(--bg-1);border-right:1px solid var(--border);}
  .panel-header{
    padding:10px 12px 8px;
    font-size:11px;color:var(--text-2);
    text-transform:uppercase;letter-spacing:0.5px;
    border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;
  }
  .panel-header button{padding:2px 8px;font-size:14px;line-height:1;}
  .panel-header .close-x{cursor:pointer;color:var(--text-2);padding:2px 6px;border-radius:3px;}
  .panel-header .close-x:hover{background:var(--bg-3);color:var(--danger);}
  #layer-list{overflow-y:auto;flex:1;padding:6px;}
  .layer-item{
    display:flex;align-items:center;gap:8px;
    padding:8px 8px;border-radius:4px;cursor:pointer;
    margin-bottom:2px;border:1px solid transparent;
  }
  .layer-item:hover{background:var(--bg-2);}
  .layer-item.active{background:var(--bg-2);border-color:var(--accent);}
  .layer-item .icon{width:16px;height:16px;flex-shrink:0;opacity:0.7;text-align:center;}
  .layer-item .name{flex:1;font-size:12px;color:var(--text-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .layer-item .vis{
    width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    color:var(--text-2);border-radius:3px;font-size:12px;
  }
  .layer-item .vis:hover{background:var(--bg-3);color:var(--text-0);}
  .layer-item.hidden{opacity:0.4;}

  /* ---------- CANVAS ---------- */
  #canvas-wrap{
    background:var(--bg-0);
    display:flex;align-items:center;justify-content:center;
    overflow:auto;position:relative;padding:20px;
  }
  #stage-shell{position:relative;box-shadow:0 0 0 1px var(--border), 0 8px 30px rgba(0,0,0,0.5);}
  #stage{display:block;background:#000;cursor:default;}
  .canvas-hint{
    position:absolute;top:8px;left:8px;
    font-size:11px;color:var(--text-2);
    background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:4px;
    pointer-events:none;
  }
  .zoom-hud{
    position:absolute;bottom:8px;right:8px;
    display:flex;gap:2px;background:rgba(0,0,0,0.5);border-radius:4px;padding:2px;
  }
  .zoom-hud button{padding:3px 8px;font-size:11px;background:transparent;border:none;color:var(--text-1);}
  .zoom-hud button:hover{background:var(--bg-3);color:var(--text-0);}
  .zoom-hud .zoom-val{padding:3px 6px;font-size:11px;color:var(--text-2);}

  /* ---------- INSPECTOR ---------- */
  #inspector-wrap{background:var(--bg-1);border-left:1px solid var(--border);min-height:0;}
  #inspector{overflow-y:auto;min-height:60px;}
  #os-config{overflow-y:auto;min-height:60px;}
  #os-config .panel-header{border-bottom:1px solid var(--border);}
  #os-config-body{padding:10px;overflow-y:auto;}
  .field-group{padding:12px;border-bottom:1px solid var(--border);}
  .field-group h4{margin:0 0 10px;font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
  .field{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
  .field label{color:var(--text-1);font-size:12px;flex-shrink:0;}
  .field input[type=text], .field input[type=number]{
    background:var(--bg-2);border:1px solid var(--border-light);color:var(--text-0);
    padding:5px 7px;border-radius:4px;font-size:12px;width:100px;font-family:var(--mono);
  }
  .field textarea{
    background:var(--bg-2);border:1px solid var(--border-light);color:var(--text-0);
    padding:5px 7px;border-radius:4px;font-size:12px;width:100%;font-family:var(--sans);resize:vertical;
  }
  .field input[type=number]{width:64px;}
  .field input[type=color]{width:32px;height:26px;padding:0;border:1px solid var(--border-light);border-radius:4px;background:none;cursor:pointer;}
  .field input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
  .field select{background:var(--bg-2);border:1px solid var(--border-light);color:var(--text-0);padding:5px 7px;border-radius:4px;font-size:12px;width:170px;}
  .row2{display:flex;gap:6px;}
  .row2 .field{flex:1;margin-bottom:0;flex-direction:column;align-items:stretch;gap:3px;}
  .row2 .field label{font-size:10px;color:var(--text-2);}
  .row2 input{width:100%!important;}
  .empty-msg{padding:24px 16px;color:var(--text-2);font-size:12px;text-align:center;line-height:1.5;}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .hint-small{font-size:11px;color:var(--text-2);margin-top:4px;line-height:1.4;}
  .img-slot-mini{
    display:flex;align-items:center;gap:8px;padding:8px;
    background:var(--bg-2);border:1px dashed var(--border-light);border-radius:5px;cursor:pointer;
  }
  .img-slot-mini:hover{border-color:var(--accent);}
  .img-slot-mini .thumb{
    width:36px;height:36px;border-radius:4px;background:var(--bg-0);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--text-2);
  }
  .img-slot-mini .thumb img{width:100%;height:100%;object-fit:contain;}
  .img-slot-mini .txt{font-size:11.5px;color:var(--text-1);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-2);}

  /* ---------- OS CONFIG PANEL ---------- */
  .os-entry{border:1px solid var(--border);border-radius:5px;padding:8px;margin-bottom:8px;background:var(--bg-2);}
  .os-entry-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .os-entry-head input[type=text]{
    flex:1;background:var(--bg-0);border:1px solid var(--border-light);color:var(--text-0);
    padding:5px 7px;border-radius:4px;font-size:12px;
  }
  .os-entry-head .os-del{color:var(--text-2);cursor:pointer;padding:2px 6px;border-radius:3px;}
  .os-entry-head .os-del:hover{color:var(--danger);background:var(--bg-3);}
  .slot-row{display:flex;gap:8px;}
  .slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .slot-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.4px;}
  .slot-box{
    width:100%;aspect-ratio:1;background:var(--bg-0);border:1px dashed var(--border-light);border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;overflow:hidden;color:var(--text-2);
  }
  .slot-box:hover{border-color:var(--accent);}
  .slot-box img{width:100%;height:100%;object-fit:contain;}
  .slot input[type=file]{display:none;}
  #btn-add-os-entry{width:auto;margin-top:2px;}

  /* ---------- MODAL ---------- */
  #modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100;}
  #modal-bg.show{display:flex;}
  #modal{
    background:var(--bg-1);border:1px solid var(--border-light);border-radius:6px;
    width:560px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  #modal.wide{width:640px;}
  #modal .m-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  #modal .m-head h3{margin:0;font-size:14px;}
  #modal .m-head .close-x{cursor:pointer;color:var(--text-2);padding:2px 8px;border-radius:3px;}
  #modal .m-head .close-x:hover{background:var(--bg-3);color:var(--danger);}
  #modal .m-body{padding:16px;overflow:auto;}
  #modal pre{
    background:var(--bg-0);border:1px solid var(--border);border-radius:4px;padding:12px;
    font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--text-0);
    white-space:pre-wrap;word-break:break-word;
  }
  #modal .m-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

  /* Canvas Properties modal specific */
  .cp-field{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .cp-field label{color:var(--text-1);font-size:12.5px;font-weight:500;}
  .cp-field select, .cp-field input{
    background:var(--bg-2);border:1px solid var(--border-light);color:var(--text-0);
    padding:6px 8px;border-radius:4px;font-size:12.5px;
  }
  .cp-field select{width:230px;}
  .cp-field input[type=number]{width:100px;font-family:var(--mono);}
  .cp-field input[type=color]{width:36px;height:28px;padding:0;cursor:pointer;}
  .cp-bg-row{display:flex;gap:6px;align-items:center;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="title">GRUB Theme Editor <span>· прототип</span></div>

    <div class="menu-item" id="menu-file">
      <button class="menu-btn" id="menu-file-btn">Файл ▾</button>
      <div class="menu-dropdown" id="menu-file-dropdown"></div>
    </div>
    <div class="menu-item" id="menu-view">
      <button class="menu-btn" id="menu-view-btn">Вид ▾</button>
      <div class="menu-dropdown" id="menu-view-dropdown"></div>
    </div>
    <button id="btn-canvas-props">Параметры холста…</button>

    <div class="spacer"></div>

    <button id="btn-add-menu">+ Меню</button>
    <button id="btn-add-progress">+ Прогресс-бар</button>
    <button id="btn-add-circular">+ Круг. прогресс</button>
    <button id="btn-add-label">+ Текст</button>
    <button id="btn-add-box">+ Прямоугольник</button>
    <button id="btn-add-image">+ Картинка</button>
    <input type="file" id="file-image-layer" accept="image/*">
    <div class="divider"></div>
    <button class="primary" id="btn-export">Экспорт theme.txt</button>
  </div>

  <div id="main-row">

    <div id="layers" class="panel-col" style="width:220px;">
      <div class="panel-header"><span>Слои</span><span class="close-x" data-panel="layers">✕</span></div>
      <div id="layer-list"></div>
    </div>

    <div class="splitter-v" data-resize="layers"></div>

    <div id="canvas-wrap" class="panel-col" style="flex:1;">
      <div id="stage-shell">
        <canvas id="stage" width="960" height="540"></canvas>
        <div class="canvas-hint" id="canvas-hint">1920×1080 · ПКМ — добавить элемент</div>
      </div>
      <div class="zoom-hud">
        <button id="zoom-out">−</button>
        <span class="zoom-val" id="zoom-val">50%</span>
        <button id="zoom-in">+</button>
        <button id="zoom-fit">Fit</button>
      </div>
    </div>

    <div class="splitter-v" data-resize="inspector-wrap"></div>

    <div id="inspector-wrap" class="panel-col" style="width:300px;">
      <div id="inspector" class="panel-col" style="height:55%;">
        <div class="panel-header"><span>Свойства</span><span class="close-x" data-panel="inspector">✕</span></div>
        <div id="inspector-body" style="overflow-y:auto;flex:1;"></div>
      </div>
      <div class="splitter-h" data-resize="os-config"></div>
      <div id="os-config" class="panel-col" style="height:45%;">
        <div class="panel-header">
          <span>Конфигурация проекта</span>
          <span style="display:flex;gap:6px;align-items:center;">
            <button id="btn-add-os-entry" style="width:auto;padding:2px 8px;">+</button>
            <span class="close-x" data-panel="os-config">✕</span>
          </span>
        </div>
        <div id="os-config-body"></div>
      </div>
    </div>

  </div>
</div>

<!-- контекстное меню правого клика по холсту -->
<div id="ctx-menu">
  <div class="menu-row" data-add="label">+ Текст</div>
  <div class="menu-row" data-add="menu">+ Меню загрузки</div>
  <div class="menu-row" data-add="box">+ Прямоугольник</div>
  <div class="menu-row" data-add="progress">+ Прогресс-бар</div>
  <div class="menu-row" data-add="circular">+ Круговой прогресс</div>
  <div class="menu-row" data-add="image">+ Картинка</div>
  <div class="menu-sep"></div>
  <div class="menu-row" id="ctx-canvas-props">Параметры холста…</div>
</div>

<!-- модалка экспорта theme.txt -->
<div id="modal-bg">
  <div id="modal">
    <div class="m-head"><h3>theme.txt</h3><span class="close-x" id="modal-close">✕</span></div>
    <div class="m-body"><pre id="export-text"></pre></div>
    <div class="m-foot">
      <button id="btn-copy">Копировать</button>
      <button class="primary" id="btn-download">Скачать theme.txt</button>
    </div>
  </div>
</div>

<!-- модалка Canvas Properties -->
<div id="cp-modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100;">
  <div style="background:var(--bg-1);border:1px solid var(--border-light);border-radius:6px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.6);">
    <div class="m-head"><h3>Параметры холста</h3><span class="close-x" id="cp-close">✕</span></div>
    <div class="m-body">
      <div class="cp-field">
        <label>Пресет GRUB</label>
        <select id="cp-preset"></select>
      </div>
      <div class="cp-field">
        <label>Ширина (px)</label>
        <input type="number" id="cp-width">
      </div>
      <div class="cp-field">
        <label>Высота (px)</label>
        <input type="number" id="cp-height">
      </div>
      <div class="cp-field">
        <label>Цвет фона</label>
        <input type="color" id="cp-bgcolor">
      </div>
      <div class="cp-field">
        <label>Фоновое изображение</label>
        <div class="cp-bg-row">
          <button id="cp-bg-browse" style="width:auto;">Обзор…</button>
          <button id="cp-bg-remove" style="width:auto;">Убрать</button>
        </div>
      </div>
      <input type="file" id="cp-bg-file" accept="image/*">
      <div class="cp-field">
        <label>Масштабирование фона</label>
        <select id="cp-bg-scale">
          <option value="stretch">stretch</option>
          <option value="crop">crop</option>
          <option value="padding">padding</option>
          <option value="fitwidth">fitwidth</option>
          <option value="fitheight">fitheight</option>
        </select>
      </div>
      <div class="cp-field">
        <label>Выравнивание фона (Г / В)</label>
        <div style="display:flex;gap:6px;">
          <select id="cp-bg-halign"><option value="left">left</option><option value="center">center</option><option value="right">right</option></select>
          <select id="cp-bg-valign"><option value="top">top</option><option value="center">center</option><option value="bottom">bottom</option></select>
        </div>
      </div>
      <div class="menu-sep" style="margin:14px 0;"></div>
      <div class="cp-field"><label>Заголовок (title-text)</label><input type="checkbox" id="cp-title-on"></div>
      <div class="cp-field"><label>Текст заголовка</label><input type="text" id="cp-title-text" style="width:230px;"></div>
      <div class="cp-field"><label>Цвет заголовка</label><input type="color" id="cp-title-color"></div>
      <div class="menu-sep" style="margin:14px 0;"></div>
      <div class="cp-field"><label>Terminal-box</label><input type="checkbox" id="cp-term-on"></div>
      <div class="cp-field">
        <label>Картинка рамки (9-patch)</label>
        <div class="cp-bg-row">
          <button id="cp-term-browse" style="width:auto;">Обзор…</button>
          <button id="cp-term-remove" style="width:auto;">Убрать</button>
        </div>
      </div>
      <input type="file" id="cp-term-file" accept="image/*">
      <div class="cp-field"><label>Толщина рамки (px)</label><input type="number" id="cp-term-border" style="width:100px;"></div>
      <div class="row2" style="margin-bottom:10px;">
        <div class="field"><label>Left %</label><input type="number" id="cp-term-left"></div>
        <div class="field"><label>Top %</label><input type="number" id="cp-term-top"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Width %</label><input type="number" id="cp-term-width"></div>
        <div class="field"><label>Height %</label><input type="number" id="cp-term-height"></div>
      </div>
      <div class="menu-sep" style="margin:14px 0;"></div>
      <div class="cp-field">
        <label>Формат координат в экспорте</label>
        <select id="cp-coord-mode">

<script>
/* ============================================================
   ПРЕСЕТЫ РАЗРЕШЕНИЙ (как в GRUB Theme Builder)
   ============================================================ */

const RESOLUTION_PRESETS = [
  { label: '640x480 (VGA 4:3)',        w: 640,  h: 480 },
  { label: '800x600 (SVGA 4:3)',       w: 800,  h: 600 },
  { label: '1024x768 (XGA 4:3)',       w: 1024, h: 768 },
  { label: '1280x720 (HD 16:9)',       w: 1280, h: 720 },
  { label: '1280x1024 (SXGA 5:4)',     w: 1280, h: 1024 },
  { label: '1366x768 (HD Widescreen)', w: 1366, h: 768 },
  { label: '1920x1080 (Full HD 16:9)', w: 1920, h: 1080 },
];

/* ============================================================
   МОДЕЛЬ ДАННЫХ
   ============================================================ */

let STAGE_W = 1920, STAGE_H = 1080; // реальное разрешение темы, теперь изменяемое
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const CANVAS_BASE_PX = 960; // ширина канвас-элемента при zoom = 100% / (STAGE_W/960)... пересчитывается ниже
let zoom = 0.5; // 50% от реального разрешения по умолчанию
let scale = 1;  // px канвас-элемента на 1 px темы = zoom (пересчитывается в resizeStage)

let layers = [];
let selectedId = null;
let idCounter = 1;
let bgImage = null;
let bgImageUrl = null;
let bgColor = '#000000';

// ---- глобальные корневые свойства темы (Приоритет 1/3) ----
let theme = {
  bgScaleMethod: 'stretch',      // stretch | crop | padding | fitwidth | fitheight
  bgHAlign: 'center',            // left | center | right
  bgVAlign: 'center',            // top | center | bottom
  titleVisible: false,
  titleText: '',
  titleFont: 'Sans Bold 28',
  titleColor: '#ffffff',
  terminalVisible: false,
  terminalBoxImg: null,          // 9-patch base url (name_*.png эмулируется одной картинкой)
  terminalBorder: 12,
  terminalLeft: 10, terminalTop: 10, terminalWidth: 80, terminalHeight: 80, // в %
  coordMode: 'percent',          // percent | px — формат экспортируемых координат
};

function resizeStage() {
  canvas.width = Math.round(STAGE_W * zoom);
  canvas.height = Math.round(STAGE_H * zoom);
  scale = zoom;
  document.getElementById('zoom-val').textContent = Math.round(zoom * 100) + '%';
  document.getElementById('canvas-hint').textContent = `${STAGE_W}×${STAGE_H} · ПКМ — добавить элемент`;
}

/* ---------- слои: базовая модель + фабрика ---------- */

function makeLayer(type, overrides = {}) {
  const base = {
    id: idCounter++,
    type,
    name: type,
    x: 200, y: 200, w: 400, h: 60,
    visible: true,
    color: '#cccccc',
    selectedColor: '#ffffff',
    fontSize: 22,
    text: 'Пункт меню',
    itemHeight: 46,
    itemCount: 3,
    barColor: '#3d5f4d',
    barBg: '#2a2a2a',
    showBarText: false,
    barText: '%d сек. до автозагрузки',
    circleColor: '#3d8a6e',
    circleBg: '#2a2a2a',
    circleText: '10s',
    boxColor: 'rgba(255,255,255,0.06)',
    boxBorder: '#ffffff33',
    imgUrl: null,
    align: 'left',            // left | center | right (для label)
    fontName: 'Sans',
    fontBold: false,          // Regular по умолчанию — как в реальных темах
    useTimeoutId: false,      // id="__timeout__" — автообновляемый компонент
    // 9-patch подложки для пунктов меню (общие на весь слой menu)
    menuNormalBg: null,
    menuSelectedBg: null,
    menuNormalBorder: 6,
    menuSelectedBorder: 6,
    menuBorderImg: null,       // menu_pixmap_style — рамка всего меню
    menuBorderBorder: 10,
    itemPadding: 6,
    itemSpacing: 0,
    itemIconSpace: 8,
    maxItemsShown: 0,          // 0 = все
    selectedFontSize: null,    // null = inherit
    scrollbarEnabled: false,
    scrollbarFrameImg: null,
    scrollbarThumbImg: null,
    scrollbarThumbOverlay: false,
    scrollbarSlice: 'east',    // west | center | east
    scrollbarLeftPad: 0, scrollbarRightPad: 0, scrollbarTopPad: 0, scrollbarBottomPad: 0,
    // progress_bar styled boxes
    barStyleImg: null,         // bar_style (рамка)
    barStyleBorder: 8,
    highlightStyleImg: null,   // highlight_style (заливка)
    highlightStyleBorder: 8,
    highlightOverlay: false,
    // circular_progress
    centerBitmap: null,
    tickBitmap: null,
    numTicks: 20,
    startAngle: -90,
    ticksDisappear: true,
  };
  const l = Object.assign(base, overrides);
  l.name = defaultName(l);
  return l;
}

function defaultName(l) {
  switch (l.type) {
    case 'menu': return 'Меню загрузки';
    case 'progress': return 'Прогресс-бар';
    case 'circular': return 'Круговой прогресс';
    case 'label': return 'Текст: ' + (l.text || '').slice(0, 14);
    case 'box': return 'Прямоугольник';
    case 'image': return 'Картинка' + (l.imgName ? ': ' + l.imgName : '');
    default: return l.type;
  }
}

function addLayer(type, atX, atY) {
  let l;
  if (type === 'menu') {
    l = makeLayer('menu', { x: atX ?? 160, y: atY ?? 380, w: 700, h: 46 * 4, itemHeight: 46, itemCount: 4 });
  } else if (type === 'progress') {
    l = makeLayer('progress', { x: atX ?? 160, y: atY ?? 900, w: 900, h: 28 });
  } else if (type === 'circular') {
    l = makeLayer('circular', { x: atX ?? 1500, y: atY ?? 700, w: 90, h: 90 });
  } else if (type === 'label') {
    l = makeLayer('label', { x: atX ?? 160, y: atY ?? 200, w: 500, h: 60, text: 'GRUB', fontSize: 40 });
  } else if (type === 'box') {
    l = makeLayer('box', { x: atX ?? 1400, y: atY ?? 380, w: 200, h: 150 });
  } else if (type === 'image') {
    l = makeLayer('image', { x: atX ?? 1400, y: atY ?? 200, w: 200, h: 200 });
  }
  layers.push(l);
  selectedId = l.id;
  renderAll();
  return l;
}

function getLayer(id) { return layers.find(l => l.id === id); }
function removeLayer(id) {
  layers = layers.filter(l => l.id !== id);
  if (selectedId === id) selectedId = null;
  renderAll();
}

/* ============================================================
   ИЗОБРАЖЕНИЯ: общий кэш (фон, osEntries, image-слои, menu bg)
   ============================================================ */

const imgCache = {};
function cacheImage(url, onDone) {
  if (!url) return;
  if (imgCache[url]) { if (onDone) onDone(imgCache[url]); return; }
  const img = new Image();
  img.onload = () => { if (onDone) onDone(img); renderAll(); };
  img.src = url;
  imgCache[url] = img;
}

/* ---------- 9-patch (nine-slice) отрисовка ----------
   Поддерживает два случая:
   1) Одна картинка + border — эмулируем 3x3 нарезку сами (как раньше).
   2) Раздельные файлы-куски (как в реальных темах GRUB: name_nw.png,
      name_n.png, ..., name_c.png) — передаются в поле slices как
      { nw,n,ne,w,c,e,sw,s,se } (любое подмножество, например только w/c/e). */
function drawNinePatch(c, urlOrSlices, x, y, w, h, border) {
  if (urlOrSlices && typeof urlOrSlices === 'object' && urlOrSlices.__slices) {
    return drawSlicedBox(c, urlOrSlices, x, y, w, h);
  }
  const img = urlOrSlices && imgCache[urlOrSlices];
  if (!img || !img.complete || !img.naturalWidth) return false;
  const b = Math.min(border, img.naturalWidth / 2 - 1, img.naturalHeight / 2 - 1, w / 2, h / 2);
  const bb = Math.max(1, b);
  const sw = img.naturalWidth, sh = img.naturalHeight;
  const srcX = [0, bb, sw - bb], srcY = [0, bb, sh - bb];
  const srcW = [bb, sw - bb * 2, bb], srcH = [bb, sh - bb * 2, bb];
  const dstX = [x, x + bb, x + w - bb], dstY = [y, y + bb, y + h - bb];
  const dstW = [bb, Math.max(0, w - bb * 2), bb], dstH = [bb, Math.max(0, h - bb * 2), bb];
  for (let r = 0; r < 3; r++) {
    for (let col = 0; col < 3; col++) {
      if (srcW[col] <= 0 || srcH[r] <= 0 || dstW[col] <= 0 || dstH[r] <= 0) continue;
      c.drawImage(img, srcX[col], srcY[r], srcW[col], srcH[r], dstX[col], dstY[r], dstW[col], dstH[r]);
    }
  }
  return true;
}

// Отрисовка из раздельных файлов-кусков (реальный формат GRUB: name_*.png).
// Работает при ЛЮБОМ подмножестве кусков — если есть только w/c/e (частый
// случай для подложки пункта меню, где верх/низ не нужны), центр и боковины
// просто растягиваются на всю высоту без углов.
function drawSlicedBox(c, slices, x, y, w, h) {
  const get = (key) => {
    const url = slices[key];
    const img = url && imgCache[url];
    return (img && img.complete && img.naturalWidth) ? img : null;
  };
  const nw = get('nw'), n = get('n'), ne = get('ne');
  const w_ = get('w'), ce = get('c'), e_ = get('e');
  const sw = get('sw'), s = get('s'), se = get('se');
  if (!nw && !n && !ne && !w_ && !ce && !e_ && !sw && !s && !se) return false;

  // ширины/высоты угловых+боковых кусков определяют размер несжимаемых краёв
  const leftW = (nw && nw.naturalWidth) || (w_ && w_.naturalWidth) || (sw && sw.naturalWidth) || 0;
  const rightW = (ne && ne.naturalWidth) || (e_ && e_.naturalWidth) || (se && se.naturalWidth) || 0;
  const topH = (nw && nw.naturalHeight) || (n && n.naturalHeight) || (ne && ne.naturalHeight) || 0;
  const botH = (sw && sw.naturalHeight) || (s && s.naturalHeight) || (se && se.naturalHeight) || 0;

  const midW = Math.max(0, w - leftW - rightW);
  const midH = Math.max(0, h - topH - botH);

  const draw = (img, dx, dy, dw, dh) => {
    if (!img || dw <= 0 || dh <= 0) return;
    c.drawImage(img, dx, dy, dw, dh);
  };

  // углы — оригинальный размер картинки (не растягиваются)
  draw(nw, x, y, leftW, topH);
  draw(ne, x + w - rightW, y, rightW, topH);
  draw(sw, x, y + h - botH, leftW, botH);
  draw(se, x + w - rightW, y + h - botH, rightW, botH);
  // края — растягиваются по одной оси
  draw(n, x + leftW, y, midW, topH);
  draw(s, x + leftW, y + h - botH, midW, botH);
  draw(w_, x, y + topH, leftW, midH);
  draw(e_, x + w - rightW, y + topH, rightW, midH);
  // центр — растягивается по обеим осям
  draw(ce, x + leftW, y + topH, midW, midH);
  return true;
}

// Обёртка для полей ввода "9-patch слот": картинка + число (border).
function nineSlotHtml(role, url, label) {
  return `
    <div class="img-slot-mini" data-role="${role}-slot" style="margin-bottom:4px;">
      <div class="thumb">${url ? `<img src="${url}">` : '＋'}</div>
      <div class="txt">${label}</div>
    </div>
    <input type="file" accept="image/*" data-role="${role}-file" style="display:none;">
  `;
}

/* ============================================================
   CANVAS: РИСОВАНИЕ РЕДАКТОРА
   ============================================================ */

function drawEditor() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (bgImage) {
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // terminal-box (глобальный, корневой элемент темы)
  if (theme.terminalVisible) {
    const tx = (theme.terminalLeft / 100) * canvas.width;
    const ty = (theme.terminalTop / 100) * canvas.height;
    const tw = (theme.terminalWidth / 100) * canvas.width;
    const th = (theme.terminalHeight / 100) * canvas.height;
    const drew = theme.terminalBoxImg && drawNinePatch(ctx, theme.terminalBoxImg, tx, ty, tw, th, theme.terminalBorder * scale);
    if (!drew) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(tx, ty, tw, th);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.strokeRect(tx, ty, tw, th);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${11 * scale}px sans-serif`;
    ctx.fillText('terminal-box', tx + 6 * scale, ty + 14 * scale);
  }

  // title-text (глобальный, наверху по центру)
  if (theme.titleVisible && theme.titleText) {
    ctx.fillStyle = theme.titleColor;
    ctx.font = `600 ${28 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(theme.titleText, canvas.width / 2, 20 * scale);
    ctx.textAlign = 'left';
  }

  layers.forEach(l => {
    if (!l.visible) return;
    drawLayerShape(ctx, l, scale);
  });

  const sel = getLayer(selectedId);
  if (sel) {
    ctx.strokeStyle = '#5b8a72';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(sel.x * scale, sel.y * scale, sel.w * scale, sel.h * scale);
    ctx.setLineDash([]);
    drawHandles(ctx, sel, scale);
  }
}

// 8 точек ресайза: 4 угла + 4 середины сторон
function getHandlePositions(l) {
  const { x, y, w, h } = l;
  return {
    nw: { x: x,       y: y       , cursor: 'nwse-resize' },
    n:  { x: x + w/2,  y: y       , cursor: 'ns-resize'   },
    ne: { x: x + w,    y: y       , cursor: 'nesw-resize' },
    e:  { x: x + w,    y: y + h/2 , cursor: 'ew-resize'   },
    se: { x: x + w,    y: y + h   , cursor: 'nwse-resize' },
    s:  { x: x + w/2,  y: y + h   , cursor: 'ns-resize'   },
    sw: { x: x,        y: y + h   , cursor: 'nesw-resize' },
    w:  { x: x,        y: y + h/2 , cursor: 'ew-resize'   },
  };
}

function drawHandles(c, l, sc) {
  const handles = getHandlePositions(l);
  c.fillStyle = '#5b8a72';
  Object.values(handles).forEach(p => {
    c.fillRect(p.x * sc - 4, p.y * sc - 4, 8, 8);
  });
}

function findHandleAt(l, x, y) {
  const handles = getHandlePositions(l);
  const tol = 8 / scale;
  for (const [key, p] of Object.entries(handles)) {
    if (Math.abs(x - p.x) < tol && Math.abs(y - p.y) < tol) return key;
  }
  return null;
}

function drawLayerShape(c, l, sc) {
  const x = l.x * sc, y = l.y * sc, w = l.w * sc, h = l.h * sc;

  if (l.type === 'menu') {
    // максимум видимых пунктов (max_items_shown)
    const shown = l.maxItemsShown > 0 ? Math.min(l.maxItemsShown, l.itemCount) : l.itemCount;
    const spacing = (l.itemSpacing || 0) * sc;
    const rowH = (h - spacing * (shown - 1)) / shown;
    const pad = (l.itemPadding || 0) * sc;
    const iconSpace = (l.itemIconSpace || 8) * sc;

    // рамка всего меню (menu_pixmap_style)
    if (l.menuBorderImg) {
      drawNinePatch(c, l.menuBorderImg, x, y, w, h, (l.menuBorderBorder || 10) * sc);
    }

    for (let i = 0; i < shown; i++) {
      const ry = y + i * (rowH + spacing);
      const active = i === 0;
      const entry = osEntries[i];

      // подложка пункта: настоящий 9-patch (styled box), либо цвет-фолбэк
      const bgUrl = active ? l.menuSelectedBg : l.menuNormalBg;
      const bgBorder = ((active ? l.menuSelectedBorder : l.menuNormalBorder) || 6) * sc;
      const drew = bgUrl ? drawNinePatch(c, bgUrl, x, ry, w, rowH, bgBorder) : false;
      if (!drew && active) {
        c.fillStyle = 'rgba(255,255,255,0.08)';
        c.fillRect(x, ry, w, rowH);
        c.strokeStyle = l.selectedColor;
        c.lineWidth = Math.max(1, 2 * sc);
        c.strokeRect(x + 2, ry + 2, w - 4, rowH - 4);
      }

      const iconUrl = active ? (entry && entry.selectedImg) : (entry && entry.normalImg);
      const iconImg = iconUrl && imgCache[iconUrl];
      let textX = x + pad + 8 * sc;
      if (iconImg && iconImg.complete) {
        const iw = rowH * 0.7, ih = rowH * 0.7;
        c.drawImage(iconImg, x + pad, ry + (rowH - ih) / 2, iw, ih);
        textX = x + pad + iw + iconSpace;
      }
      const fs = (active && l.selectedFontSize ? l.selectedFontSize : l.fontSize) * sc;
      c.fillStyle = active ? l.selectedColor : l.color;
      c.font = `${fs}px sans-serif`;
      c.textBaseline = 'middle';
      const label = entry ? entry.name : `Пункт ${i + 1}`;
      c.fillText(label, textX, ry + rowH / 2);
    }

    // скроллбар (превью, если пунктов больше, чем помещается)
    if (l.scrollbarEnabled && l.itemCount > shown) {
      const barW = 8 * sc;
      const barX = l.scrollbarSlice === 'west' ? x - barW - 4 * sc
                 : l.scrollbarSlice === 'center' ? x + w / 2 - barW / 2
                 : x + w + 4 * sc;
      const trackY = y + (l.scrollbarTopPad || 0) * sc;
      const trackH = h - ((l.scrollbarTopPad || 0) + (l.scrollbarBottomPad || 0)) * sc;
      if (l.scrollbarFrameImg) {
        drawNinePatch(c, l.scrollbarFrameImg, barX, trackY, barW, trackH, 4 * sc);
      } else {
        c.fillStyle = 'rgba(255,255,255,0.08)';
        c.fillRect(barX, trackY, barW, trackH);
      }
      const thumbH = Math.max(20 * sc, trackH * (shown / l.itemCount));
      if (l.scrollbarThumbImg) {
        drawNinePatch(c, l.scrollbarThumbImg, barX, trackY, barW, thumbH, 4 * sc);
      } else {
        c.fillStyle = l.selectedColor;
        c.fillRect(barX, trackY, barW, thumbH);
      }
    }
  }

  if (l.type === 'progress') {
    const frameDrawn = l.barStyleImg && drawNinePatch(c, l.barStyleImg, x, y, w, h, (l.barStyleBorder || 8) * sc);
    if (!frameDrawn) {
      c.fillStyle = l.barBg;
      c.fillRect(x, y, w, h);
    }
    const fillW = w * 0.62;
    const hlDrawn = l.highlightStyleImg && drawNinePatch(c, l.highlightStyleImg, x, y, fillW, h, (l.highlightStyleBorder || 8) * sc);
    if (!hlDrawn) {
      c.fillStyle = l.barColor;
      c.fillRect(x, y, fillW, h);
    } else if (l.highlightOverlay && frameDrawn) {
      // highlight_overlay: заливка рисуется поверх, с наложением скруглений рамки
      drawNinePatch(c, l.barStyleImg, x, y, w, h, (l.barStyleBorder || 8) * sc);
    }
    if (!frameDrawn) {
      c.strokeStyle = 'rgba(255,255,255,0.15)';
      c.strokeRect(x, y, w, h);
    }
    if (l.showBarText) {
      c.fillStyle = '#ffffff';
      c.font = `${Math.max(10, h * 0.55)}px sans-serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      const displayText = l.barText.replace('%d', '7');
      c.fillText(displayText, x + w / 2, y + h / 2);
      c.textAlign = 'left';
    }
  }

  if (l.type === 'circular') {
    const cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h) / 2 - 4 * sc;
    const startRad = (l.startAngle || 0) * Math.PI / 180;
    const numTicks = Math.max(1, l.numTicks || 20);
    const tickImg = l.tickBitmap && imgCache[l.tickBitmap];
    const activeTicks = Math.round(numTicks * 0.55); // демо-значение прогресса для превью

    if (tickImg && tickImg.complete) {
      // тики рисуются картинками по окружности (tick_bitmap)
      for (let i = 0; i < numTicks; i++) {
        const on = l.ticksDisappear ? i >= activeTicks : i < activeTicks;
        if (!on) continue;
        const ang = startRad + (i / numTicks) * Math.PI * 2;
        const tw = Math.max(4, r * 0.16), th = tw;
        const tx = cx + Math.cos(ang) * r - tw / 2;
        const ty = cy + Math.sin(ang) * r - th / 2;
        c.drawImage(tickImg, tx, ty, tw, th);
      }
    } else {
      c.lineWidth = Math.max(2, 6 * sc);
      c.strokeStyle = l.circleBg;
      c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = l.circleColor;
      c.beginPath(); c.arc(cx, cy, r, startRad, startRad + Math.PI * 2 * 0.55); c.stroke();
    }

    const centerImg = l.centerBitmap && imgCache[l.centerBitmap];
    if (centerImg && centerImg.complete) {
      const cw = r * 1.3, ch = r * 1.3;
      c.drawImage(centerImg, cx - cw / 2, cy - ch / 2, cw, ch);
    }
    c.fillStyle = '#ffffff';
    c.font = `600 ${Math.max(9, r * 0.5)}px sans-serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(l.circleText, cx, cy);
    c.textAlign = 'left';
  }

  if (l.type === 'label') {
    c.fillStyle = l.color;
    c.font = `600 ${l.fontSize * sc}px sans-serif`;
    c.textBaseline = 'top';
    const align = l.align || 'left';
    c.textAlign = align;
    const tx = align === 'center' ? x + w / 2 : align === 'right' ? x + w : x;
    c.fillText(l.text, tx, y);
    c.textAlign = 'left';
  }

  if (l.type === 'box') {
    c.fillStyle = l.boxColor;
    c.fillRect(x, y, w, h);
    c.strokeStyle = l.boxBorder;
    c.lineWidth = Math.max(1, 2 * sc);
    c.strokeRect(x, y, w, h);
  }

  if (l.type === 'image') {
    const img = l.imgUrl && imgCache[l.imgUrl];
    if (img && img.complete) {
      c.drawImage(img, x, y, w, h);
    } else {
      c.fillStyle = 'rgba(255,255,255,0.05)';
      c.fillRect(x, y, w, h);
      c.strokeStyle = 'rgba(255,255,255,0.2)';
      c.setLineDash([4, 3]);
      c.strokeRect(x, y, w, h);
      c.setLineDash([]);
      c.fillStyle = 'rgba(255,255,255,0.35)';
      c.font = `${Math.min(w, h) * 0.25}px sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('🖼', x + w / 2, y + h / 2);
      c.textAlign = 'left';
    }
  }
}

/* ============================================================
   КОНФИГУРАЦИЯ ПУНКТОВ МЕНЮ (обычная / выбранная иконка на пункт)
   ============================================================ */

let osEntries = [
  { id: 1, name: 'Ubuntu, Linux 6.8', normalImg: null, selectedImg: null },
  { id: 2, name: 'Windows Boot Manager', normalImg: null, selectedImg: null }
];
let osIdCounter = 3;

function addOsEntry() {
  osEntries.push({ id: osIdCounter++, name: 'Новая запись', normalImg: null, selectedImg: null });
  renderOsConfig();
}
function removeOsEntry(id) {
  osEntries = osEntries.filter(e => e.id !== id);
  renderOsConfig();
  drawEditor();
}

function renderOsConfig() {
  const body = document.getElementById('os-config-body');
  body.innerHTML = '';
  if (osEntries.length === 0) {
    body.innerHTML = '<div class="empty-msg">Нет пунктов меню.<br>Добавьте кнопкой «+» в заголовке.</div>';
    return;
  }
  osEntries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'os-entry';
    div.innerHTML = `
      <div class="os-entry-head">
        <input type="text" value="${escapeHtml(e.name)}" data-role="name">
        <span class="os-del" data-role="del">✕</span>
      </div>
      <div class="slot-row">
        <div class="slot">
          <div class="slot-label">Иконка обычная</div>
          <div class="slot-box" data-role="normal-box">${e.normalImg ? `<img src="${e.normalImg}">` : '＋'}</div>
          <input type="file" accept="image/*" data-role="normal-file">
        </div>
        <div class="slot">
          <div class="slot-label">Иконка выбрана</div>
          <div class="slot-box" data-role="selected-box">${e.selectedImg ? `<img src="${e.selectedImg}">` : '＋'}</div>
          <input type="file" accept="image/*" data-role="selected-file">
        </div>
      </div>
    `;
    div.querySelector('[data-role="name"]').addEventListener('input', (ev) => { e.name = ev.target.value; drawEditor(); });
    div.querySelector('[data-role="del"]').addEventListener('click', () => removeOsEntry(e.id));

    const normalFile = div.querySelector('[data-role="normal-file"]');
    div.querySelector('[data-role="normal-box"]').addEventListener('click', () => normalFile.click());
    normalFile.addEventListener('change', (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      e.normalImg = URL.createObjectURL(f);
      cacheImage(e.normalImg);
      renderOsConfig();
    });

    const selFile = div.querySelector('[data-role="selected-file"]');
    div.querySelector('[data-role="selected-box"]').addEventListener('click', () => selFile.click());
    selFile.addEventListener('change', (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      e.selectedImg = URL.createObjectURL(f);
      cacheImage(e.selectedImg);
      renderOsConfig();
    });

    body.appendChild(div);
  });
}

document.getElementById('btn-add-os-entry').addEventListener('click', addOsEntry);

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   ВЗАИМОДЕЙСТВИЕ С CANVAS: drag / resize (8 точек) / контекстное меню
   ============================================================ */

let dragMode = null; // 'move' | 'resize' | null
let resizeHandle = null;
let dragStart = { x: 0, y: 0 };
let layerStart = null;

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const { x, y } = toStageCoords(e);
  const sel = getLayer(selectedId);
  if (sel) {
    const handle = findHandleAt(sel, x, y);
    if (handle) {
      dragMode = 'resize';
      resizeHandle = handle;
      dragStart = { x, y };
      layerStart = { ...sel };
      return;
    }
  }
  for (let i = layers.length - 1; i >= 0; i--) {
    const l = layers[i];
    if (!l.visible) continue;
    if (x >= l.x && x <= l.x + l.w && y >= l.y && y <= l.y + l.h) {
      selectedId = l.id;
      dragMode = 'move';
      dragStart = { x, y };
      layerStart = { ...l };
      renderAll();
      return;
    }
  }
  selectedId = null;
  renderAll();
});

window.addEventListener('mousemove', (e) => {
  if (!dragMode) {
    // курсор-подсказка при наведении на хендл
    const sel = getLayer(selectedId);
    if (sel && e.target === canvas) {
      const { x, y } = toStageCoords(e);
      const handle = findHandleAt(sel, x, y);
      const handles = getHandlePositions(sel);
      canvas.style.cursor = handle ? handles[handle].cursor : 'default';
    }
    return;
  }
  const { x, y } = toStageCoords(e);
  const l = getLayer(selectedId);
  if (!l) return;
  const dx = x - dragStart.x, dy = y - dragStart.y;

  if (dragMode === 'move') {
    l.x = Math.round(layerStart.x + dx);
    l.y = Math.round(layerStart.y + dy);
  } else if (dragMode === 'resize') {
    applyResize(l, layerStart, resizeHandle, dx, dy);
  }
  renderAll();
});

function applyResize(l, start, handle, dx, dy) {
  let { x, y, w, h } = start;
  const minSize = 16;
  if (handle.includes('e')) w = Math.max(minSize, start.w + dx);
  if (handle.includes('s')) h = Math.max(minSize, start.h + dy);
  if (handle.includes('w')) { w = Math.max(minSize, start.w - dx); x = start.x + (start.w - w); }
  if (handle.includes('n')) { h = Math.max(minSize, start.h - dy); y = start.y + (start.h - h); }
  l.x = Math.round(x); l.y = Math.round(y); l.w = Math.round(w); l.h = Math.round(h);
  if (l.type === 'image') l.imgAutoSize = false; // ручной ресайз отменяет авто-размер по исходной картинке
}

window.addEventListener('mouseup', () => { dragMode = null; resizeHandle = null; layerStart = null; });

function toStageCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (canvas.width / rect.width);
  const py = (e.clientY - rect.top) * (canvas.height / rect.height);
  return { x: px / scale, y: py / scale };
}

/* ---------- контекстное меню правого клика ---------- */

let ctxMenuStagePos = { x: 0, y: 0 };
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  ctxMenuStagePos = toStageCoords(e);
  const menu = document.getElementById('ctx-menu');
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('show');
});
window.addEventListener('click', (e) => {
  if (!e.target.closest('#ctx-menu')) document.getElementById('ctx-menu').classList.remove('show');
});
document.querySelectorAll('#ctx-menu [data-add]').forEach(item => {
  item.addEventListener('click', () => {
    const type = item.getAttribute('data-add');
    addLayer(type, Math.round(ctxMenuStagePos.x - 60), Math.round(ctxMenuStagePos.y - 20));
    document.getElementById('ctx-menu').classList.remove('show');
  });
});
document.getElementById('ctx-canvas-props').addEventListener('click', () => {
  document.getElementById('ctx-menu').classList.remove('show');
  openCanvasProps();
});

/* ============================================================
   ПАНЕЛЬ СЛОЁВ
   ============================================================ */

function renderLayerList() {
  const list = document.getElementById('layer-list');
  list.innerHTML = '';
  if (layers.length === 0) {
    list.innerHTML = '<div class="empty-msg">Слоёв нет.<br>ПКМ по холсту или кнопки сверху.</div>';
    return;
  }
  layers.forEach(l => {
    const div = document.createElement('div');
    div.className = 'layer-item' + (l.id === selectedId ? ' active' : '') + (!l.visible ? ' hidden' : '');
    div.innerHTML = `
      <span class="icon">${layerIcon(l.type)}</span>
      <span class="name">${escapeHtml(l.name)}</span>
      <span class="vis" data-act="toggle">${l.visible ? '👁' : '—'}</span>
      <span class="vis" data-act="del">✕</span>
    `;
    div.addEventListener('click', (e) => {
      const act = e.target.getAttribute('data-act');
      if (act === 'toggle') { l.visible = !l.visible; renderAll(); return; }
      if (act === 'del') { removeLayer(l.id); return; }
      selectedId = l.id;
      renderAll();
    });
    list.appendChild(div);
  });
}

function layerIcon(type) {
  return { menu: '☰', progress: '▬', circular: '◐', label: 'T', box: '▢', image: '🖼' }[type] || '•';
}

        ${l.showBarText ? `<div class="field" style="flex-direction:column;align-items:stretch;gap:4px;">
          <label>Текст (%d — секунды)</label>
          <input type="text" data-k="barText" value="${escapeHtml(l.barText)}" style="width:100%;">
        </div>` : ''}
      </div>
      <div class="field-group">
        <h4>Styled boxes (9-patch)</h4>
        ${nineSlotHtml('bar-style', l.barStyleImg, 'bar_style — рамка бара')}
        <div class="field"><label>Толщина, px</label><input type="number" data-k="barStyleBorder" value="${l.barStyleBorder}"></div>
        ${nineSlotHtml('highlight-style', l.highlightStyleImg, 'highlight_style — заливка')}
        <div class="field"><label>Толщина, px</label><input type="number" data-k="highlightStyleBorder" value="${l.highlightStyleBorder}"></div>
        <div class="field"><label>highlight_overlay</label><input type="checkbox" data-k="highlightOverlay" data-type="checkbox" ${l.highlightOverlay ? 'checked' : ''}></div>
        <div class="hint-small">highlight_overlay=true — рамка накладывается поверх заливки, для скруглённых краёв.</div>
      </div>
    `;
  }

  if (l.type === 'circular') {
    fields += `
      <div class="field-group">
        <h4>Круговой прогресс</h4>
        <div class="field"><label>id="__timeout__"</label><input type="checkbox" data-k="useTimeoutId" data-type="checkbox" ${l.useTimeoutId ? 'checked' : ''}></div>
        <div class="field"><label>Цвет заливки (фолбэк)</label><input type="color" data-k="circleColor" value="${l.circleColor}"></div>
        <div class="field"><label>Цвет фона (фолбэк)</label><input type="color" data-k="circleBg" value="${l.circleBg}"></div>
        <div class="field"><label>Текст в центре</label><input type="text" data-k="circleText" value="${escapeHtml(l.circleText)}"></div>
        <div class="field"><label>num_ticks</label><input type="number" data-k="numTicks" value="${l.numTicks}"></div>
        <div class="field"><label>start_angle (°)</label><input type="number" data-k="startAngle" value="${l.startAngle}"></div>
        <div class="field"><label>ticks_disappear</label><input type="checkbox" data-k="ticksDisappear" data-type="checkbox" ${l.ticksDisappear ? 'checked' : ''}></div>
      </div>
      <div class="field-group">
        <h4>Картинки (bitmaps)</h4>
        ${nineSlotHtml('center-bitmap', l.centerBitmap, 'center_bitmap — картинка в центре')}
        ${nineSlotHtml('tick-bitmap', l.tickBitmap, 'tick_bitmap — картинка одной метки')}
        <div class="hint-small">Если tick_bitmap не задан — используется упрощённая дуга-заглушка.</div>
      </div>
    `;
  }

  if (l.type === 'label') {
    fields += `
      <div class="field-group">
        <h4>Текст</h4>
        <div class="field"><label>Содержимое</label><input type="text" data-k="text" value="${escapeHtml(l.text)}"></div>
        <div class="field" style="margin-bottom:10px;">
          <label>Вставить переменную</label>
          <select id="label-var-insert" style="width:170px;">
            <option value="">— выбрать —</option>
            <option value="@TIMEOUT_NOTIFICATION_SHORT@">@TIMEOUT_NOTIFICATION_SHORT@</option>
            <option value="@TIMEOUT_NOTIFICATION_MIDDLE@">@TIMEOUT_NOTIFICATION_MIDDLE@</option>
            <option value="@TIMEOUT_NOTIFICATION_LONG@">@TIMEOUT_NOTIFICATION_LONG@</option>
            <option value="@KEYMAP_SHORT@">@KEYMAP_SHORT@</option>
            <option value="@KEYMAP_MIDDLE@">@KEYMAP_MIDDLE@</option>
            <option value="@KEYMAP_LONG@">@KEYMAP_LONG@</option>
          </select>
        </div>
        <div class="field"><label>id="__timeout__"</label><input type="checkbox" data-k="useTimeoutId" data-type="checkbox" ${l.useTimeoutId ? 'checked' : ''}></div>
        <div class="field"><label>Шрифт (семейство)</label><input type="text" data-k="fontName" value="${escapeHtml(l.fontName)}" style="width:120px;"></div>
        <div class="field"><label>Размер шрифта</label><input type="number" data-k="fontSize" value="${l.fontSize}"></div>
        <div class="field"><label>Цвет</label><input type="color" data-k="color" value="${l.color}"></div>
        <div class="field"><label>Выравнивание</label>
          <select data-k="align">
            <option value="left" ${l.align==='left'?'selected':''}>left</option>
            <option value="center" ${l.align==='center'?'selected':''}>center</option>
            <option value="right" ${l.align==='right'?'selected':''}>right</option>
          </select>
        </div>
      </div>
    `;
  }

  if (l.type === 'box') {
    fields += `
      <div class="field-group">
        <h4>Прямоугольник</h4>
        <div class="field"><label>Заливка</label><input type="color" data-k="boxColorPicker" value="${rgbaToHex(l.boxColor)}"></div>
        <div class="field"><label>Цвет рамки</label><input type="color" data-k="boxBorderPicker" value="${rgbaToHex(l.boxBorder)}"></div>
        <div class="hint-small">Декоративный элемент — просто прямоугольная область без содержимого.</div>
      </div>
    `;
  }

  if (l.type === 'image') {
    fields += `
      <div class="field-group">
        <h4>Картинка</h4>
        ${nineSlotHtml('image-file-slot', l.imgUrl, l.imgUrl ? 'Заменить картинку' : 'Выбрать картинку')}
        <div class="hint-small">Произвольная декоративная картинка (лого, персонаж, элемент оформления).</div>
      </div>
    `;
  }

  fields += `
    <div class="field-group">
      <button id="btn-del-layer" style="width:100%;color:var(--danger);border-color:var(--danger);">Удалить слой</button>
    </div>
  `;

  el.innerHTML = fields;

  el.querySelectorAll('input[data-k], select[data-k]').forEach(inp => {
    inp.addEventListener('input', () => {
      const k = inp.getAttribute('data-k');
      if (inp.type === 'checkbox') {
        l[k] = inp.checked;
        renderInspector(); // перерисовать блок (появление/скрытие текста прогресс-бара)
      } else if (k === 'boxColorPicker') {
        l.boxColor = inp.value;
      } else if (k === 'boxBorderPicker') {
        l.boxBorder = inp.value;
      } else if (k === 'selectedFontSize') {
        const n = Number(inp.value);
        l.selectedFontSize = n > 0 ? n : null;
      } else {
        l[k] = inp.type === 'number' ? Number(inp.value) : inp.value;
      }
      if ((k === 'w' || k === 'h') && l.type === 'image') l.imgAutoSize = false;
      l.name = defaultName(l);
      renderAll();
    });
  });

  // Универсальное подключение всех 9-patch / картиночных слотов вида
  // role="xxx-slot" + role="xxx-file"  ->  ключ модели в camelCase (xxxKEY передаётся картой ниже)
  const slotKeyMap = {
    'menu-border': 'menuBorderImg',
    'menu-normal-bg': 'menuNormalBg',
    'menu-selected-bg': 'menuSelectedBg',
    'scrollbar-frame': 'scrollbarFrameImg',
    'scrollbar-thumb': 'scrollbarThumbImg',
    'bar-style': 'barStyleImg',
    'highlight-style': 'highlightStyleImg',
    'center-bitmap': 'centerBitmap',
    'tick-bitmap': 'tickBitmap',
    'image-file-slot': 'imgUrl',
  };
  Object.entries(slotKeyMap).forEach(([role, targetKey]) => {
    const box = el.querySelector(`[data-role="${role}-slot"], [data-role="${role}"]`);
    const file = el.querySelector(`[data-role="${role}-file"]`);
    if (!box || !file) return;
    box.addEventListener('click', () => file.click());
    file.addEventListener('change', (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      const url = URL.createObjectURL(f);
      l[targetKey] = url;
      cacheImage(url);
      renderInspector();
      renderAll();
    });
  });

  // вставка спец. переменных в текст label
  const varSelect = document.getElementById('label-var-insert');
  if (varSelect) {
    varSelect.addEventListener('change', () => {
      if (!varSelect.value) return;
      l.text = (l.text || '') + varSelect.value;
      l.name = defaultName(l);
      renderAll();
      renderInspector();
    });
  }

  document.getElementById('btn-del-layer').addEventListener('click', () => removeLayer(l.id));
}

function rgbaToHex(v) {
  // на входе может быть уже hex или rgba(...) — для простоты приводим только не-hex к approx
  if (!v) return '#ffffff';
  if (v.startsWith('#')) return v.length === 9 ? v.slice(0, 7) : v; // срезаем альфу если есть #rrggbbaa
  return '#ffffff';
}

/* ============================================================
   ЭКСПОРТ theme.txt
   ============================================================ */

// координата в текущем выбранном формате (проценты или пиксели)
function coord(v, total) {
  if (theme.coordMode === 'px') return String(Math.round(v));
  return Math.round((v / total) * 1000) / 10 + '%';
}
function pct(v, total) { return coord(v, total); }

function buildThemeTxt() {
  const lines = [];
  lines.push(`# Сгенерировано GRUB Theme Editor`);
  lines.push(`desktop-image: "background.png"`);
  lines.push(`desktop-color: "${bgColor}"`);
  lines.push(`desktop-image-scale-method: "${theme.bgScaleMethod}"`);
  lines.push(`desktop-image-h-align: "${theme.bgHAlign}"`);
  lines.push(`desktop-image-v-align: "${theme.bgVAlign}"`);
  if (theme.titleVisible && theme.titleText) {
    lines.push(`title-text: "${theme.titleText}"`);
    lines.push(`title-font: "${theme.titleFont}"`);
    lines.push(`title-color: "${theme.titleColor}"`);
  } else {
    lines.push(`title-text: ""`);
  }
  if (theme.terminalVisible) {
    if (theme.terminalBoxImg) lines.push(`terminal-box: "assets/terminal_box/terminal_*.png"`);
    lines.push(`terminal-border: ${theme.terminalBorder}`);
    lines.push(`terminal-left: ${theme.terminalLeft}%`);
    lines.push(`terminal-top: ${theme.terminalTop}%`);
    lines.push(`terminal-width: ${theme.terminalWidth}%`);
    lines.push(`terminal-height: ${theme.terminalHeight}%`);
  }
  lines.push('');

  layers.forEach(l => {
    if (!l.visible) return;
    if (l.type === 'menu') {
      lines.push(`+ boot_menu {`);
      lines.push(`  left = ${coord(l.x, STAGE_W)}`);
      lines.push(`  top = ${coord(l.y, STAGE_H)}`);
      lines.push(`  width = ${coord(l.w, STAGE_W)}`);
      lines.push(`  height = ${coord(l.h, STAGE_H)}`);
      lines.push(`  item_height = ${l.itemHeight}`);
      lines.push(`  item_padding = ${l.itemPadding}`);
      lines.push(`  item_spacing = ${l.itemSpacing}`);
      lines.push(`  item_icon_space = ${l.itemIconSpace}`);
      lines.push(`  item_font = "${l.fontName || 'Sans'} Regular ${l.fontSize}"`);
      lines.push(`  selected_item_font = "${l.fontName || 'Sans'} Bold ${l.selectedFontSize || l.fontSize}"`);
      lines.push(`  item_color = "${l.color}"`);
      lines.push(`  selected_item_color = "${l.selectedColor}"`);
      lines.push(`  icon_width = 32`);
      lines.push(`  icon_height = 32`);
      if (l.maxItemsShown > 0) lines.push(`  max_items_shown = ${l.maxItemsShown}`);
      if (l.menuBorderImg || l.menuBorderPattern) lines.push(`  menu_pixmap_style = "${l.menuBorderPattern || `assets/menu-${l.id}/menu_*.png`}"`);
      if (l.menuNormalBg || l.menuNormalPattern) lines.push(`  item_pixmap_style = "${l.menuNormalPattern || `assets/menu-${l.id}/item_*.png`}"`);
      if (l.menuSelectedBg || l.menuSelectedPattern) lines.push(`  selected_item_pixmap_style = "${l.menuSelectedPattern || `assets/menu-${l.id}/select_*.png`}"`);
      lines.push(`  scrollbar = ${l.scrollbarEnabled ? 'true' : 'false'}`);
      if (l.scrollbarEnabled) {
        if (l.scrollbarFrameImg) lines.push(`  scrollbar_frame = "assets/menu-${l.id}/scroll_frame_*.png"`);
        if (l.scrollbarThumbImg) lines.push(`  scrollbar_thumb = "assets/menu-${l.id}/scroll_thumb_*.png"`);
        lines.push(`  scrollbar_thumb_overlay = ${l.scrollbarThumbOverlay ? 'true' : 'false'}`);
        lines.push(`  scrollbar_slice = ${l.scrollbarSlice}`);
        lines.push(`  scrollbar_left_pad = ${l.scrollbarLeftPad}`);
        lines.push(`  scrollbar_right_pad = ${l.scrollbarRightPad}`);
        lines.push(`  scrollbar_top_pad = ${l.scrollbarTopPad}`);
        lines.push(`  scrollbar_bottom_pad = ${l.scrollbarBottomPad}`);
      }
      lines.push(`  visible = ${l.visible ? 'true' : 'false'}`);
      lines.push(`}`);
    }
    if (l.type === 'progress') {
      lines.push(`+ progress_bar {`);
      if (l.useTimeoutId) lines.push(`  id = "__timeout__"`);
      lines.push(`  left = ${coord(l.x, STAGE_W)}`);
      lines.push(`  top = ${coord(l.y, STAGE_H)}`);
      lines.push(`  width = ${coord(l.w, STAGE_W)}`);
      lines.push(`  height = ${l.h}`);
      lines.push(`  fg_color = "${l.barColor}"`);
      lines.push(`  bg_color = "${l.barBg}"`);
      lines.push(`  border_color = "#ffffff"`);
      if (l.barStyleImg) lines.push(`  bar_style = "assets/progress-${l.id}/frame_*.png"`);
      if (l.highlightStyleImg) {
        lines.push(`  highlight_style = "assets/progress-${l.id}/highlight_*.png"`);
        lines.push(`  highlight_overlay = ${l.highlightOverlay ? 'true' : 'false'}`);
      }
      if (l.showBarText) {
        lines.push(`  show_text = true`);
        lines.push(`  text = "${l.barText}"`);
        lines.push(`  text_color = "white"`);
        lines.push(`  font = "Sans Regular 16"`);
      }
      lines.push(`}`);
    }
    if (l.type === 'circular') {
      lines.push(`+ circular_progress {`);
      if (l.useTimeoutId) lines.push(`  id = "__timeout__"`);
      lines.push(`  left = ${coord(l.x, STAGE_W)}`);
      lines.push(`  top = ${coord(l.y, STAGE_H)}`);
      lines.push(`  width = ${l.w}`);
      lines.push(`  height = ${l.h}`);
      if (l.centerBitmap) lines.push(`  center_bitmap = "assets/circular-${l.id}/center.png"`);
      if (l.tickBitmap) lines.push(`  tick_bitmap = "assets/circular-${l.id}/tick.png"`);
      lines.push(`  num_ticks = ${l.numTicks}`);
      lines.push(`  ticks_disappear = ${l.ticksDisappear ? 'true' : 'false'}`);
      lines.push(`  start_angle = ${l.startAngle}`);
      lines.push(`}`);
    }
    if (l.type === 'label') {
      lines.push(`+ label {`);
      if (l.useTimeoutId) lines.push(`  id = "__timeout__"`);
      lines.push(`  left = ${coord(l.x, STAGE_W)}`);
      lines.push(`  top = ${coord(l.y, STAGE_H)}`);
      lines.push(`  width = ${coord(l.w, STAGE_W)}`);
      lines.push(`  text = "${l.text}"`);
      lines.push(`  font = "${l.fontName || 'Sans'} ${l.fontBold ? 'Bold' : 'Regular'} ${l.fontSize}"`);
      lines.push(`  color = "${l.color}"`);
      lines.push(`  align = "${l.align || 'left'}"`);
      lines.push(`}`);
    }
    if (l.type === 'box') {
      lines.push(`# Прямоугольник-декор "${l.name}" — GRUB не имеет примитива "box",`);
      lines.push(`# эмулируется через + image с готовой PNG-заливкой нужного цвета/рамки:`);
      lines.push(`+ image {`);
      lines.push(`  left = ${coord(l.x, STAGE_W)}`);
      lines.push(`  top = ${coord(l.y, STAGE_H)}`);
      lines.push(`  width = ${coord(l.w, STAGE_W)}`);
      lines.push(`  height = ${coord(l.h, STAGE_H)}`);
      lines.push(`  file = "assets/box-${l.id}.png"`);
      lines.push(`}`);
    }
    if (l.type === 'image') {
      lines.push(`+ image {`);
      lines.push(`  left = ${coord(l.x, STAGE_W)}`);
      lines.push(`  top = ${coord(l.y, STAGE_H)}`);
      if (!l.imgAutoSize) {
        lines.push(`  width = ${coord(l.w, STAGE_W)}`);
        lines.push(`  height = ${coord(l.h, STAGE_H)}`);
      }
      lines.push(`  file = "${l.imgPattern || `assets/image-${l.id}.png`}"`);
      lines.push(`}`);
    }
    lines.push('');
  });

  if (osEntries.length) {
    lines.push('# ---------------------------------------------------------');
    lines.push('# Пункты меню и их иконки (обычная / выбранная).');
    lines.push('# Привязка идёт через --class <имя> у каждого menuentry в grub.cfg.');
    lines.push('# ---------------------------------------------------------');
    osEntries.forEach((e, i) => {
      lines.push(`# ${i + 1}. "${e.name}"`);
      lines.push(`#    normal:   ${e.normalImg ? 'icons/item-' + (i + 1) + '.png' : '(не задано)'}`);
      lines.push(`#    selected: ${e.selectedImg ? 'icons/item-' + (i + 1) + '-selected.png' : '(не задано)'}`);
    });
    lines.push('');
  }

  lines.push('# ---------------------------------------------------------');
  lines.push('# Примечания по 9-patch: файлы вида name_*.png нужно нарезать из');
  lines.push('# исходной картинки на 9 частей (nw,n,ne,w,c,e,sw,s,se) по границе');
  lines.push('# border, указанной для каждого слота в редакторе — предпросмотр');
  lines.push('# в редакторе уже показывает именно такое 9-slice масштабирование.');
  lines.push('# Формат координат допускает и смешанный вид: left = 25%+10');
  lines.push('# ---------------------------------------------------------');

  return lines.join('\n');
}

document.getElementById('btn-export').addEventListener('click', () => {
  document.getElementById('export-text').textContent = buildThemeTxt();
  document.getElementById('modal-bg').classList.add('show');
});
document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal-bg').classList.remove('show'));
document.getElementById('btn-copy').addEventListener('click', () => navigator.clipboard.writeText(buildThemeTxt()));
document.getElementById('btn-download').addEventListener('click', () => {
  const blob = new Blob([buildThemeTxt()], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'theme.txt';
  a.click();
});

function populatePresetSelect() {
  const sel = document.getElementById('cp-preset');
  sel.innerHTML = RESOLUTION_PRESETS.map(p => `<option value="${p.w}x${p.h}">${p.label}</option>`).join('')
    + `<option value="custom">Custom…</option>`;
}
populatePresetSelect();

function openCanvasProps() {
  document.getElementById('cp-width').value = STAGE_W;
  document.getElementById('cp-height').value = STAGE_H;
  document.getElementById('cp-bgcolor').value = bgColor;
  const matched = RESOLUTION_PRESETS.find(p => p.w === STAGE_W && p.h === STAGE_H);
  document.getElementById('cp-preset').value = matched ? `${STAGE_W}x${STAGE_H}` : 'custom';

  document.getElementById('cp-bg-scale').value = theme.bgScaleMethod;
  document.getElementById('cp-bg-halign').value = theme.bgHAlign;
  document.getElementById('cp-bg-valign').value = theme.bgVAlign;
  document.getElementById('cp-title-on').checked = theme.titleVisible;
  document.getElementById('cp-title-text').value = theme.titleText;
  document.getElementById('cp-title-color').value = theme.titleColor;
  document.getElementById('cp-term-on').checked = theme.terminalVisible;
  document.getElementById('cp-term-browse').textContent = theme.terminalBoxImg ? 'Файл выбран ✓' : 'Обзор…';
  document.getElementById('cp-term-border').value = theme.terminalBorder;
  document.getElementById('cp-term-left').value = theme.terminalLeft;
  document.getElementById('cp-term-top').value = theme.terminalTop;
  document.getElementById('cp-term-width').value = theme.terminalWidth;
  document.getElementById('cp-term-height').value = theme.terminalHeight;
  document.getElementById('cp-coord-mode').value = theme.coordMode;

  document.getElementById('cp-modal-bg').style.display = 'flex';
}

let pendingTermFile = null;
document.getElementById('cp-term-browse').addEventListener('click', () => document.getElementById('cp-term-file').click());
document.getElementById('cp-term-file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  pendingTermFile = URL.createObjectURL(f);
  document.getElementById('cp-term-browse').textContent = 'Файл выбран ✓';
});
document.getElementById('cp-term-remove').addEventListener('click', () => {
  pendingTermFile = 'REMOVE';
  document.getElementById('cp-term-browse').textContent = 'Обзор…';
});
document.getElementById('btn-canvas-props').addEventListener('click', openCanvasProps);
document.getElementById('cp-close').addEventListener('click', () => document.getElementById('cp-modal-bg').style.display = 'none');
document.getElementById('cp-cancel').addEventListener('click', () => document.getElementById('cp-modal-bg').style.display = 'none');

document.getElementById('cp-preset').addEventListener('change', (e) => {
  if (e.target.value === 'custom') return;
  const [w, h] = e.target.value.split('x').map(Number);
  document.getElementById('cp-width').value = w;
  document.getElementById('cp-height').value = h;
});
['cp-width', 'cp-height'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById('cp-preset').value = 'custom';
  });
});

document.getElementById('cp-bg-browse').addEventListener('click', () => document.getElementById('cp-bg-file').click());
let pendingBgFile = null;
document.getElementById('cp-bg-file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  pendingBgFile = URL.createObjectURL(f);
  document.getElementById('cp-bg-browse').textContent = 'Файл выбран ✓';
});
document.getElementById('cp-bg-remove').addEventListener('click', () => {
  pendingBgFile = 'REMOVE';
  document.getElementById('cp-bg-browse').textContent = 'Обзор…';
});

document.getElementById('cp-ok').addEventListener('click', () => {
  STAGE_W = Number(document.getElementById('cp-width').value) || STAGE_W;
  STAGE_H = Number(document.getElementById('cp-height').value) || STAGE_H;
  bgColor = document.getElementById('cp-bgcolor').value;
  if (pendingBgFile === 'REMOVE') {
    bgImage = null; bgImageUrl = null;
  } else if (pendingBgFile) {
    bgImageUrl = pendingBgFile;
    const img = new Image();
    img.onload = () => { bgImage = img; renderAll(); };
    img.src = pendingBgFile;
  }
  pendingBgFile = null;
  document.getElementById('cp-bg-browse').textContent = 'Обзор…';

  theme.bgScaleMethod = document.getElementById('cp-bg-scale').value;
  theme.bgHAlign = document.getElementById('cp-bg-halign').value;
  theme.bgVAlign = document.getElementById('cp-bg-valign').value;
  theme.titleVisible = document.getElementById('cp-title-on').checked;
  theme.titleText = document.getElementById('cp-title-text').value;
  theme.titleColor = document.getElementById('cp-title-color').value;
  theme.terminalVisible = document.getElementById('cp-term-on').checked;
  theme.terminalBorder = Number(document.getElementById('cp-term-border').value) || 12;
  theme.terminalLeft = Number(document.getElementById('cp-term-left').value) || 0;
  theme.terminalTop = Number(document.getElementById('cp-term-top').value) || 0;
  theme.terminalWidth = Number(document.getElementById('cp-term-width').value) || 80;
  theme.terminalHeight = Number(document.getElementById('cp-term-height').value) || 80;

  if (pendingTermFile === 'REMOVE') {
    theme.terminalBoxImg = null;
  } else if (pendingTermFile) {
    theme.terminalBoxImg = pendingTermFile;
    cacheImage(pendingTermFile);
  }
  pendingTermFile = null;

  resizeStage();
  renderAll();
  document.getElementById('cp-modal-bg').style.display = 'none';
});
